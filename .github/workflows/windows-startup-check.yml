name: Windows startup compatibility
on:
  push:
    branches: [main]
    paths:
      - 'app/pet/autostart.py'
      - 'app/pet/windows_startup_link.py'
      - 'app/tests/test_autostart.py'
      - '.github/workflows/windows-startup-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  startup:
    runs-on: windows-latest
    env:
      PYTHONUTF8: 1
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13.14'
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pytest -q app/tests/test_autostart.py
